name: mancala
description: Mancala by Wajiha - 100% free fun game.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Procedural artisan audio (synthesized stone clacks, kalimba music).
  audioplayers: ^6.1.0
  # Local persistence for settings and stats.
  shared_preferences: ^2.3.3
  # Pro unlock + tip jar (real Play Billing; graceful when unconfigured).
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/mancala_logo.png
    - assets/wajiha_logo.png

  # Bundled display/body typefaces for the Artisan Mancala design system
  # (OFL-licensed: Playfair Display + Manrope).
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-Black.ttf
          weight: 900
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
